# mitm-proxy 框架配置 — 不含任何业务字段
# 业务配置（backend/auth/region_map）已迁移到规则脚本的 @config 段
server:
  listen: ":8082"

# 正向代理配置
proxy:
  enable: true
  listen: ":8081"
  cert_dir: "certs"
  hosts_file: "hosts.txt"
  intercept_domains: []
  upstream_map: {}

# 规则引擎配置
rules:
  dir: "rules"
  hot_reload: true
  watch_interval: 2s

# Web UI
webui:
  enable: true

# 调试面板
debug:
  enable: true
  buffer_size: 200
