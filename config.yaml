# yunapi-proxy 配置
server:
  listen: ":8082"

# tapm-api 后端地址
backend:
  url: "http://127.0.0.1:16686"
  # 后端统一入口路径（ForwardYunAPI 注册的路径）
  api_path: "/api/v1"
  timeout: 30s

# Mock 认证信息（模拟 yunapi 注入的字段）
mock_auth:
  uin: "1500000686"
  sub_account_uin: "700001199694"
  app_id: 251005942

# 正向代理配置（用于 SwitchyOmega 直连模式）
proxy:
  enable: true
  listen: ":8081"
  cert_dir: "certs"
  # Whistle 格式的 hosts 文件（IP domain 格式）
  hosts_file: "hosts.txt"
  # 需要 MITM 拦截的域名（只对这些域名解密 HTTPS）
  intercept_domains:
    - "console.cloud.tencent.com"
  # 额外的上游服务器映射（与 hosts_file 合并生效）
  upstream_map: {}

# regionId 到 Region 字符串的映射
region_map:
  1: "ap-guangzhou"
  4: "ap-shanghai"
  8: "ap-beijing"
  9: "ap-singapore"
  11: "ap-shenzhen"
  15: "ap-chengdu"
  16: "ap-chongqing"
  19: "ap-hongkong"
  21: "na-siliconvalley"
  22: "na-ashburn"
  25: "ap-bangkok"
