# mitm-proxy 配置
server:
  listen: ":8082"

# 后端服务地址（适配器默认 fallback 值，可在 adapters 段覆盖）
backend:
  url: "http://127.0.0.1:16686"
  api_path: "/api/v1"
  timeout: 30s

# 正向代理配置（用于 SwitchyOmega 直连模式）
proxy:
  enable: true
  listen: ":8081"
  cert_dir: "certs"
  # Whistle 格式的 hosts 文件（IP domain 格式）
  hosts_file: "hosts.txt"
  # 额外的 MITM 拦截域名（与规则脚本中 @intercept 指令合并生效）
  # 通常由规则脚本管理，这里留空即可
  intercept_domains: []
  # 额外的上游服务器映射（与 hosts_file 合并生效）
  upstream_map: {}

# 规则引擎配置
rules:
  dir: "rules"            # 规则脚本目录（每个 .rules 文件一个脚本）
  hot_reload: true        # 是否监听文件变化自动重载
  watch_interval: 2s      # 文件监听间隔

# Pipeline 适配器配置（被 pipeline:// 规则引用）
adapters:
  yunapi:
    type: "yunapi"
    backend:
      url: "http://127.0.0.1:16686"
      api_path: "/api/v1"
      timeout: 30s
    auth:
      uin: "1500000686"
      sub_account_uin: "700001199694"
      app_id: 251005942
      
    region_map:
      1: "ap-guangzhou"
      4: "ap-shanghai"
      5: "ap-hongkong"
      7: "ap-shanghai-fsi"
      8: "ap-beijing"
      9: "ap-singapore"
      11: "ap-shenzhen"
      15: "na-siliconvalley"
      16: "ap-chengdu"
      17: "eu-frankfurt"
      19: "ap-hongkong"
      21: "na-siliconvalley"
      22: "na-ashburn"
      25: "ap-bangkok"
      46: "ap-beijing-fsi"
      100: "qcloud"
      101: "me-saudi-arabia"
